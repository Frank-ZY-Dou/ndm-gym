# Lint and byte-compile on every push and pull request. The tests need Isaac Lab, MuJoCo-Warp, a GPU for the
# simulator tests and the LAFAN1 motions (not redistributed), so they run locally: `make test-fast`.
name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: python -m compileall -q ndm_gym tools tests benchmarks
